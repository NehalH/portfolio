params:
  # theme
  showToc: true
  TocOpen: false
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  hideMeta: false

  # for enchanced SEO
  env: production
  title: Nehal Hosalikar
  description: "Senior Software Engineer specializing in scalable microservices, distributed enterprise applications, PostgreSQL, and AWS cloud architecture."
  keywords: [Portfolio, Nehal Hosalikar, Senior Software Engineer, Deloitte, Microservices, Node.js, TypeScript, PostgreSQL, AWS, Distributed Systems]
  author: Nehal Hosalikar

  # Home Page
  profileMode:
    enabled: true
    title: "Nehal Hosalikar"
    subtitle: Senior Software Engineer at [**Deloitte**](https://www.deloitte.com/global/en.html)

    imageUrl: "home/profile-img.jpeg"
    imageWidth: 300
    imageHeight: 300
    buttons:
      - name: About
        url: about/about
      - name: Resume
        url: "Nehal_Hosalikar.pdf"

  # List View
  hideDescriptionInList: false

  # cover image for posts
  cover:
    hiddenInList: false # hide on list pages and home
    hiddenInSingle: false # hide on single page

  socialIcons:
    - name: "email"
      url: "mailto:nhosalikar@gmail.com"
    - name: "linkedin"
      url: "https://www.linkedin.com/in/nehal-hosalikar"
    - name: "github"
      url: "https://github.com/NehalH"
    - name: "twitter"
      url: "https://twitter.com/nhosalikar"
    #- name: "youtube"
    #  url: ""

  # text search
  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    location: 0
    distance: 1000
    threshold: 0.4
    minMatchCharLength: 0
    keys: ["title", "permalink", "summary", "content"]

# for search using Fuse.js
outputs:
  home:
    - HTML
    - RSS
    - JSON

# allow HTML in MD
markup:
  goldmark:
    renderer:
      unsafe: true
